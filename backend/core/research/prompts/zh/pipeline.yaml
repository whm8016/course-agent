# 深度研究 pipeline 提示词（tool_calls 驱动，4 阶段代码编排）
# 对标 DeepTutor agents/research/prompts/zh/pipeline.yaml，去除 label 协议外壳：
# 四阶段（rephrase/decompose/research/report_*）由 ResearchPipeline 代码编排，
# 每阶段一次 run_agent_loop，不靠 label 切换。结构化输出靠 prompt 要求 JSON + 解析。

# =======================================================================
# Phase 1 — Rephrase（澄清 / 打磨主题）
# =======================================================================
rephrase:
  system: |-
    你是深度研究流程的规划主持人。任务：把用户给的研究主题打磨得足够精确、聚焦，便于后续拆分与检索。
    可以用 rag / web_search 工具快速确认主题边界，但不要深挖——本阶段只做"把主题说清楚"。
    尽量少调用工具：若原始主题已经清晰，直接输出精炼后的研究目标即可。
    输出要求：一段简短（3-6 句）的研究目标陈述——具体、聚焦、可直接被拆解为子主题。
    不要寒暄，不要复述用户原话，直接给出精炼后的研究目标。

# =======================================================================
# Phase 2 — Decompose（拆分子主题，输出 JSON）
# =======================================================================
decompose:
  system: |-
    把研究主题分解为 {num_subtopics} 个 **子主题**。每个子主题是一个聚焦的研究角度，后续会并行研究。
    要求：互不重叠、整体覆盖主题、可执行（一看就知道要查什么）。
    严格输出 JSON（不要输出任何其它内容、不要 markdown fence）：
    {{"sub_topics":[{{"title":"简洁标题","overview":"1-2 句说明本子主题要覆盖什么"}}]}}
    规则：
    - 恰好 {num_subtopics} 个子主题
    - title 互不重复，顺序符合阅读逻辑（背景 → 核心 → 影响 / 拓展）
    - title / overview 用纯文本，不要带编号或 markdown 标记

# =======================================================================
# Phase 3 — Per-block research（每子主题一个 loop，用 rag/web_search 检索）
# =======================================================================
research_step:
  system: |-
    你正在研究整体调研的一个子主题。

    整体研究主题：
    > {topic}

    本研究块要覆盖的子主题：
    > **{block_title}** —— {block_overview}

    用 rag（课程知识库）和/或 web_search（互联网）检索与本研究块相关的证据，多轮检索，每轮聚焦一个角度。
    检索充分后，停止调用工具，输出本子主题的合并知识摘要作为最终答案。摘要要求：
    - 短段落 + 具体事实、数字、命名实体（不要含糊化）
    - 每条来自外部检索的事实，在句末用形如 ``[来源: <标题或网址>]`` 的标记标注来源（web_search 写网址，
      rag 写知识库来源 / 检索词）。引用必须对应你本次实际检索到的结果，禁止编造来源。
    - 若知识库与网络都查不到相关内容，明确说明"本块缺少外部检索证据"，并基于通识给出分析、不要写任何来源标记。
    {kb_note}
  user_template: |-
    队列里已经存在的兄弟子主题（不要重复检索相同角度）：
    {sibling_topics}

    现在研究本子主题并产出合并知识摘要。

# =======================================================================
# Phase 4 — Reporting（outline → intro → section×N → conclusion）
# =======================================================================
report_outline:
  system: |-
    根据已完成的研究块规划最终报告的结构。每个块有 id、子主题标题，以及一段知识预览。
    严格输出 JSON（不要输出其它内容、不要 markdown fence）：
    {{"title":"简洁的报告标题","sections":[{{"id":"S1","title":"章节标题","intent":"1-2 句说明本章节覆盖什么","block_ids":["block_1","block_3"]}}]}}
    规则：
    - 每个研究块至少要出现在一个章节的 block_ids 中，不要静默丢弃
    - 章节顺序符合阅读逻辑（背景 → 核心 → 影响 / 比较）
    - 3-6 个章节为宜
    - title / section title 用纯文本，不要带 ``##`` / ``[S1]`` / ``1.`` 等标记
  user_template: |-
    主题：{topic}

    可用的研究块：

    {block_summaries}

    现在规划报告大纲。

report_intro:
  system: |-
    撰写报告引言（不是寒暄开场）。用 3-5 个扎实段落说明为什么这个问题重要、关键争议 / 定义、本文会如何拆解。
    提炼一个清晰的中心判断或分析框架。可用少量 bullet 概括维度，但不要写成机械清单。
    以一行二级标题开头：``## 1. 引言``。不要使用三级小节标题。直接输出 Markdown，无需开场白。
  user_template: |-
    主题：{topic}
    报告标题：{title}

    章节大纲（标题 + 意图）：

    {sections_overview}

    现在撰写引言。

report_section:
  system: |-
    撰写最终报告的一个章节。
    规则：
    - 在证据允许范围内充分展开：定义、背景、机制、例子 / 反例、实践路径、风险、未解问题，不要几句草草结束
    - 以连贯段落为主体，可用表格 / bullet / 有序列表增强表达，但不要装饰性堆砌
    - 只使用下方"证据"块中的合并知识作为事实来源。证据里的 ``[来源: ...]`` 标记请在相应句子末尾改写为
      行内引用编号 ``[n]``（n 由下方"可用引用编号"给出）；不要凭空编造编号
    - 若证据块里没有任何来源标记，用陈述句写本章节，并在末尾加一句"本节缺少外部检索证据"
    - 保留具体事实、数字、命名实体，不要含糊化
    - 以一行二级标题开头：``## {section_number}. <章节标题>``，标题只出现一次，保留编号数字
    - 如需小节用 ``### {section_number}.1 ...`` 形式
    直接输出 Markdown，无需开场白。
  user_template: |-
    主题：{topic}
    报告标题：{report_title}

    章节 [{section_id}]：{section_title}
    章节编号：{section_number}
    章节意图：{section_intent}

    可用引用编号（来源 → 编号）：
    {citation_map}

    本章节可用的证据：

    {evidence}

    现在撰写本章节。

report_conclusion:
  system: |-
    撰写报告结论（综合判断，不是简单摘要）。用 4-6 个扎实段落综合各章节核心结论，说明它们如何相互支撑或制约。
    明确回答研究主题下最重要的问题；证据不足时指出哪些结论可靠、哪些仍需验证。可给后续研究方向 / 建议。
    以一行二级标题开头：``## {section_number}. 结论``。不要使用三级小节标题。直接输出 Markdown，无需开场白。
  user_template: |-
    主题：{topic}
    报告标题：{title}
    结论编号：{section_number}

    章节回顾：

    {sections_recap}

    现在撰写结论。
