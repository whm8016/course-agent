short_description: "从课程知识库检索与问题最相关的内容片段（事实检索 / 关系推理两种策略）。"
when_to_use: "当问题大概率来自课程材料（概念、定义、公式、原理、教材与课件内容）时优先使用。每轮最多调用一次，用一个能覆盖问题要点的查询词，不要拆成多次检索。"
input_format: '{"query": "从用户问题提炼的核心检索词", "strategy": "fact"}'
guideline: "课程知识点相关的问题优先用 rag。query 必须具体、非空，检索一次即可。strategy 默认 fact（查定义/公式/事实，向量精确匹配）；当问题涉及实体间关系、对比、因果、多个概念如何关联时用 relationship（走知识图谱推理，擅长多跳关联）。若上方已有「知识库预检索」块且能回答，不要重复调用本工具。"
note: "检索结果是检索引擎返回的原文片段，可能含噪声，需结合上下文判断相关性。若工具返回「未检索到相关内容」（无命中），应明确告知学生当前课程资料未覆盖该问题，不要改用通用知识硬答。"
phase: "exploration"
