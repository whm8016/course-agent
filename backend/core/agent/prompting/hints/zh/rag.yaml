short_description: "从课程知识库检索与问题最相关的内容片段。"
when_to_use: "当问题大概率来自课程材料（概念、定义、公式、原理、教材与课件内容）时优先使用。每轮最多调用一次，用一个能覆盖问题要点的查询词，不要拆成多次检索。"
input_format: '{"query": "从用户问题提炼的核心检索词"}'
guideline: "课程知识点相关的问题优先用 rag。query 必须具体、非空。检索一次即可，结果不理想时直接基于已有内容作答，不要反复调用。"
note: "检索结果是检索引擎返回的原文片段，可能含噪声，需结合上下文判断相关性。"
phase: "exploration"
