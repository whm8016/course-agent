short_description: "查询学生本人的成绩记录——各次作业 / 考试的得分、满分与评语。"
when_to_use: "当学生问自己的分数、某次考试考了多少、成绩怎样、哪些没及格时使用。只查得到该学生本人的成绩。"
input_format: '{"item_keyword": "期中"}'
guideline: "学生问「我期中考了多少分 / 成绩 / 分数」时用此工具。item_keyword 可按条目名称（如期中、作业1）过滤。"
note: "只能查到学生本人的成绩；这是得分记录（分数 / 满分 / 评语），不是题目内容。若结果为空，说明该学生没有相关成绩记录，应据实说明。"
phase: "exploration"
