short_description: "查询学生本人的课表——所选修课程的上课时间、地点、任课教师与周次。"
when_to_use: "当学生问自己的上课时间、教室、第几周有课、某天有什么课时使用。只查得到该学生本人已选课程的课表。"
input_format: '{"weekday": 3}'
guideline: "学生问「我几点上课 / 下周三有什么课 / 在哪上课」时用此工具。weekday 取 1-7（1=周一…7=周日）可选过滤；问具体某天就传对应 weekday，问整张课表则不传。"
note: "只能查到学生本人的课表；未选课的课程不会出现。若结果为空，说明该学生没有相关课表记录，应据实说明。"
phase: "exploration"
