short_description: "查询学生本人做错的题目——之前答错的题面、错误答案、正确答案与解析。"
when_to_use: "当学生问自己哪些题做错了、最近错题、错在哪、为什么错时使用。只查得到该学生本人答错的题。"
input_format: '{"keyword": "电路"}'
guideline: "学生问「我哪些题做错了 / 错题 / 错在哪」时用此工具。keyword 可按题目内容关键词过滤。"
note: "只能查到学生本人答错的题（错题本）；这是题目内容（题面 / 你的错答 / 正确答案 / 解析），不是分数。若结果为空，说明该学生没有相关错题记录，应据实说明。"
phase: "exploration"
