short_description: "检索学生本人此前保存的长期记忆--预注入没命中时的兜底再查。"
when_to_use: "当上下文里的「用户记忆」段没有所需信息、但学生的问法暗示之前提过（如「我上次说的那个」「你不是记着吗」）时，换个说法再查一次。"
input_format: '{"query": "检索词或自然语言描述", "limit": 5}'
guideline: "先用上下文「用户记忆」段；确实没有再调本工具。query 换种说法往往能命中；不传 query 则返回最近若干条记忆。"
note: "只能读当前学生本人的记忆。若结果为空，说明此前未保存相关内容，应据实说明，不要编造记忆。"
phase: "exploration"
