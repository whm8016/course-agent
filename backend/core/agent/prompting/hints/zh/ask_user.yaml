short_description: "向学生提出澄清问题（以卡片展示），暂停推理等待回复后继续。"
when_to_use: "仅当缺少关键信息、确实无法合理继续时使用——例如问题指代不清、或合理假设会显著改变答案。不要用来确认学生已经说过的话，也不要问有没有显然答案的问题。"
input_format: '{"questions": [{"id": "q1", "prompt": "...", "options": ["A", "B"]}], "intro": "可选导语"}'
guideline: "默认直接动手：只有确实无法合理继续时才用 ask_user，且一次把所有要澄清的问题问全（最多 4 个），不要分多次。其余情况用合理假设直接做，并在回答里说明假设。"
note: "调用后循环暂停，学生回复后才继续；仅 WebSocket 入口有效，HTTP SSE 入口会直接结束。"
phase: "exploration"
