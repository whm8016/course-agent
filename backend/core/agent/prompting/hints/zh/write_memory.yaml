short_description: "写入一条跨会话长期记忆--逐字保存学生原话，不改写。"
when_to_use: "当学生明确要求「帮我记一下 / 记住 / 别忘了」，或主动透露学习偏好、教材版本、目标分数、账号卡号等下次还有用的信息时使用。"
input_format: '{"content": "要记住的内容"}'
guideline: "学生说「记一下 / 记住 / 别忘了」时用此工具。content 用学生原话或其明确要记的信息，不要自行概括或改写；存完后向学生复述一遍已记住的内容以确认。"
note: "涉及支付密码、完整证件号等敏感信息时，先向学生确认是否真的要存。只能存当前学生本人的记忆；已存内容学生可在「我的记忆」页自行删除。"
phase: "exploration"
