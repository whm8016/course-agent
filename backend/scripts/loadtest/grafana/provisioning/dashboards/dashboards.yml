# Grafana dashboard provider：自动加载 ./grafana/dashboards 下的 JSON 看板。
apiVersion: 1
providers:
  - name: loadtest
    orgId: 1
    folder: "压测 Load Test"
    type: file
    disableDeletion: false
    editable: true
    updateIntervalSeconds: 10
    options:
      path: /var/lib/grafana/dashboards
      foldersFromFilesStructure: false
