# 压测前置代理：Locust → nginx(:8000) → 1× backend(gunicorn -w4)
#
# 两条关键正确性：
#   1. SSE（/api/chat）必须 proxy_buffering off——否则 nginx 攒满内部 buffer 才一次性下发，
#      首 token 被攒在 nginx 里，ca_llm_first_token_seconds（TTFT）指标完全失真。
#   2. WebSocket（/api/run/*）必须透传 Upgrade / Connection 头，否则握手失败。

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

upstream backend_pool {
    # 单 backend（对齐生产 docker-compose.yml：1 容器 gunicorn -w4），不再 4 容器。
    server backend:8002 max_fails=3 fail_timeout=10s;
}

server {
    listen 8000;

    # SSE（/api/chat）+ 普通接口：禁缓冲，流式 token 实时透传。
    location / {
        proxy_pass http://backend_pool;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # WebSocket（/api/run/*）：透传 Upgrade / Connection（最长前缀匹配，优先于 location /）。
    location /api/run/ {
        proxy_pass http://backend_pool;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}
