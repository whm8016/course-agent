<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { overflow: hidden; }
  body {
    width: 1680px;
    height: 1020px;
    background: #ffffff;
    font-family: "Segoe UI", "Microsoft YaHei", "PingFang SC", sans-serif;
    color: #222;
    padding: 22px 28px 18px;
  }
  .hint {
    text-align: center;
    font-size: 18px;
    color: #444;
    margin-bottom: 14px;
  }
  .hint b { color: #1f4e8c; }
  .panel {
    border: 2px dashed #8a93a0;
    border-radius: 16px;
    height: 308px;
    margin-bottom: 14px;
    padding: 10px 22px 8px 18px;
    position: relative;
    display: flex;
    align-items: center;
  }
  .panel.c { border-color: #6b5cb0; background: #f7f4fd; }
  .lab {
    position: absolute;
    top: 10px; left: 16px;
    font-size: 26px;
    font-weight: 800;
    font-family: "Times New Roman", "SimSun", serif;
  }
  .row {
    width: 100%;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 28px 8px 0 52px;
  }
  .node {
    display: flex;
    flex-direction: column;
    align-items: center;
    width: 168px;
    text-align: center;
  }
  .node.wide { width: 220px; }
  .node .name {
    margin-top: 8px;
    font-size: 18px;
    font-weight: 800;
    line-height: 1.25;
  }
  .node .sub {
    margin-top: 3px;
    font-size: 13px;
    color: #666;
    line-height: 1.3;
  }
  .arr {
    flex: 0 0 56px;
    display: flex;
    justify-content: center;
    color: #333;
  }
  .loop {
    border: 1.6px dashed #b0b7c2;
    border-radius: 14px;
    background: #f4f6f8;
    padding: 10px 16px 8px;
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .split {
    display: flex;
    flex-direction: column;
    gap: 10px;
    align-items: flex-start;
  }
  .mini {
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .mini span { font-size: 16px; font-weight: 700; }
</style>
</head>
