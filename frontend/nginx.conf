upstream backend_pool {
    ip_hash;  # Sticky session: 同一 IP 的请求落到同一 worker (TurnRuntimeManager 进程内状态)
    server backend:8002;
    keepalive 32;
}

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    # 0.0.0.0 / [::]：局域网内其它设备可通过 http://<宿主机IP> 访问（非仅 127.0.0.1）
    listen 0.0.0.0:80;
    listen [::]:80;
    server_name _;
    client_max_body_size 300m;

    root /usr/share/nginx/html;
    index index.html;

    # ============================================================
    # 性能优化：启用 gzip 压缩
    # ============================================================
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        application/xml+rss
        application/x-javascript
        image/svg+xml
        font/woff
        font/woff2
        font/ttf
        font/eot;

    # ============================================================
    # 安全头
    # ============================================================
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # ============================================================
    # 静态资源缓存策略
    # ============================================================
    # 静态资源（JS/CSS/图片/字体）- 长期缓存
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot|map)$ {
        try_files $uri $uri/ /index.html;
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # index.html - 不缓存（SPA 需要每次获取最新）
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
    }

    # ============================================================
    # SPA 路由支持
    # ============================================================
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ============================================================
    # API 代理
    # ============================================================
    location /api/ {
        proxy_pass http://backend_pool;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # SSE 流式响应 - 需要较长超时
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
        proxy_connect_timeout 60s;

        # SSE 流式：禁缓冲，首 token 实时透传（proxy_buffering on 会把流攒包、抬高 TTFT）
        proxy_buffering off;
        proxy_cache off;
    }

    # ============================================================
    # 上传文件代理
    # ============================================================
    location /uploads/ {
        proxy_pass http://backend_pool;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;

        # 大文件上传超时
        client_max_body_size 300m;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        proxy_connect_timeout 60s;
    }

    # ============================================================
    # 监控端点（仅内部网络访问）
    # ============================================================
    location /metrics {
        proxy_pass http://backend_pool;
        proxy_http_version 1.1;
        proxy_set_header Host $host;

        # IP 白名单限制
        allow 127.0.0.1;
        allow 10.0.0.0/8;
        allow 172.16.0.0/12;
        allow 192.168.0.0/16;
        deny all;

        access_log off;
    }

    # ============================================================
    # 健康检查
    # ============================================================
    location /health {
        proxy_pass http://backend_pool;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        access_log off;
    }

    # ============================================================
    # 日志配置
    # ============================================================
    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log warn;
}
