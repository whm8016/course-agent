services:
  postgres:
    # 自建镜像：pgvector/pgvector:pg16 + 编译 zhparser（中文分词扩展）。
    # simple 配置对中文不分词，sparse 路整句一个 token 0 命中；zhparser 让 tsvector 按词切。
    # 词典走 mmap 共享 OS page cache，per-connection 内存趋近 0，适配 4GB 部署。见 postgres/Dockerfile。
    build:
      context: ./postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-postgres}"
      POSTGRES_DB: course_agent
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # 持久化：AOF（每次写追加 appendonly.aof，默认 everysec fsync，最多丢 1s 数据）
    # + RDB 快照（60s 内 1000 次写则 dump.rdb），双保险；重启/重建容器数据不丢。
    command: ["redis-server", "--appendonly", "yes", "--save", "60", "1000"]
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # ── Elasticsearch 已移除（第四期 drop-es）─────────────────────────────────
  # 混合检索的 sparse/BM25 路改用 Postgres tsvector：llamaindex_pg 的 SPARSE 模式
  # 走 PG 全文；LightRAG 的 ES 混合由 settings.elasticsearch.enabled=false（默认）关闭，
  # get_es_store 连不上时自动降级纯 dense。省 512MB JVM 堆 + 一个容器。
  # 若仍要用 ES（自托管混合检索），自行加回此服务块 + .env 开 ELASTICSEARCH__ENABLED=true。

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      # 只绑宿主机回环：外部流量一律走 frontend(nginx:80) 反代；
      # 回环同时挡住宿主机以外对 /docs /metrics 的裸访问（第二道防线是
      # main.py 在 production 关 docs_url/redoc_url/openapi_url）。
      - "127.0.0.1:8002:8002"
    env_file:
      - ./backend/.env
    environment:
      # config 嵌套重构后代码读 DB__URL / DB__REDIS_URL（env_nested_delimiter="__"），
      # 不再认旧扁平名 DATABASE_URL / REDIS_URL。compose environment 优先级高于
      # env_file(./backend/.env)，这里用 Docker 服务名覆盖 .env 里的 localhost
      # （localhost 是宿主机开发用的，容器内回环连不到 postgres/redis 容器）。
      DB__URL: postgresql+asyncpg://postgres:${POSTGRES_PASSWORD:-postgres}@postgres:5432/course_agent
      DB__REDIS_URL: redis://redis:6379/0
      ENVIRONMENT: "${ENVIRONMENT:-development}"
      BACKEND_WORKERS: "${BACKEND_WORKERS:-4}"
      LLM_TIMEOUT_SEC: "${LLM_TIMEOUT_SEC:-120}"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      PROMETHEUS_MULTIPROC_DIR: /dev/shm/prometheus_multiproc
      # 编程题沙箱（core/question/sandbox.py service 模式）：socket/token 注入，
      # mode 默认 service（compose 部署即容器隔离口径；Windows 直跑 dev 不进
      # compose，settings 默认 local 不受影响）。生产漏配由 settings._check_prod 拒启。
      SANDBOX__MODE: "${SANDBOX__MODE:-service}"
      SANDBOX__TOKEN: "${SANDBOX_TOKEN:-}"
      SANDBOX__SOCKET: /run/sandbox/sandbox.sock
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      # 软依赖：不等健康检查——沙箱挂了 backend 照常起，判分降级 ungraded
      sandbox:
        condition: service_started
    volumes:
      - ./backend:/app
      - backend_venv:/app/.venv
      - backend_uploads:/app/uploads
      - sandbox_sock:/run/sandbox
    command: ["sh", "-c", "mkdir -p /dev/shm/prometheus_multiproc && rm -rf /dev/shm/prometheus_multiproc/* && until .venv/bin/alembic upgrade head; do echo 'alembic failed, retrying in 5s...'; sleep 5; done && .venv/bin/gunicorn main:app -k uvicorn.workers.UvicornWorker -w $${BACKEND_WORKERS:-4} --bind 0.0.0.0:8002 --timeout 300 --graceful-timeout 30"]
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8002/api/health')\""]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s

  # ARQ 后台任务 worker：索引/研究/解题均在此进程中执行
  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    # SIGTERM 停机宽限：ARQ handle_sig 会 cancel 在跑任务 → job finally 里释放索引锁。
    # compose 默认只给 10s，大任务清理慢会被 SIGKILL 硬杀、只能等锁租约自然过期；
    # 60s 覆盖优雅释放（SIGKILL/OOM 兜底仍靠租约 TTL + 死锁偷取）。
    stop_grace_period: 60s
    env_file:
      - ./backend/.env
    environment:
      DB__URL: postgresql+asyncpg://postgres:${POSTGRES_PASSWORD:-postgres}@postgres:5432/course_agent
      DB__REDIS_URL: redis://redis:6379/0
      ENVIRONMENT: "${ENVIRONMENT:-development}"
      LLM_TIMEOUT_SEC: "${LLM_TIMEOUT_SEC:-120}"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      SANDBOX__MODE: "${SANDBOX__MODE:-service}"
      SANDBOX__TOKEN: "${SANDBOX_TOKEN:-}"
      SANDBOX__SOCKET: /run/sandbox/sandbox.sock
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      backend:
        condition: service_healthy
      sandbox:
        condition: service_started
    volumes:
      - ./backend:/app
      - backend_venv:/app/.venv
      - backend_uploads:/app/uploads
      - sandbox_sock:/run/sandbox
    # 与 backend 一致：先建 PROMETHEUS_MULTIPROC_DIR（Dockerfile ENV 对 worker 也生效，
    # 但 ENV 不创建目录）。缺目录会让多进程模式下指标构造 FileNotFoundError（eval 注释已记录
    # 同坑）→ 模块体中途失败被驱逐 → ARQ 重试二次 import 撞 Duplicated timeseries。
    command: ["sh", "-c", "mkdir -p /dev/shm/prometheus_multiproc && rm -rf /dev/shm/prometheus_multiproc/* && exec .venv/bin/python -m arq worker.WorkerSettings"]
    # worker 不监听 HTTP，健康检查查 PID1 cmdline 是否 arq（镜像无 procps/pgrep）。
    # 勿改回扫全部 /proc/*/cmdline 的写法：检查进程自身的 cmdline 就含字面量 arq，
    # 恒真重言式（2026-09-10 压测套件复审发现后与 loadtest 侧同批修复）。
    # command 用 exec 起 arq → PID1 即 arq：arq 死则容器死、由 restart 兜底。
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import sys; sys.exit(0 if b'arq' in open('/proc/1/cmdline','rb').read() else 1)\""]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  # ── MCP gateway sidecar ────────────────────────────────────────────────
  # 把 stdio 类 MCP server（modelscope-mcp-server / mcp-server-fetch）收敛成一份
  # SSE 服务。backend 的 4 个 gunicorn worker 全部以 HTTP 客户端接入这一个 gateway，
  # 替换原先"每 worker 各起一份 uvx 子进程"（4N 份常驻 → 每个 server 仅 1 份，省内存）。
  # deepwiki 不走 gateway（用官方远程 https://mcp.deepwiki.com/mcp，免认证无子进程）。
  # 详见 backend/docs/ARCHITECTURE.md「MCP gateway sidecar」节。
  mcp-gateway:
    build:
      context: ./mcp-gateway
      dockerfile: Dockerfile
      args:
        UV_INDEX_URL: "${UV_INDEX_URL:-}"
    restart: unless-stopped
    environment:
      # modelscope-mcp-server 直连 ModelScope API 的 token；mcp-proxy --pass-environment
      # 透传给 stdio 子进程。空则该 server 工具调用时报鉴权错，不影响 gateway 本身与其余 server。
      MODELSCOPE_API_TOKEN: "${MODELSCOPE_API_TOKEN:-}"
      UV_OFFLINE: "1"            # 运行时兜底：构建期已预装，任何意外拉包快速失败而非卡到超时
      PYTHONDONTWRITEBYTECODE: "1"
      HOME: /tmp                 # 引导子进程缓存写 tmpfs（不挂业务卷，靠容器隔离 + mem_limit 兜底）
    ports:
      - "127.0.0.1:8096:8096"    # 宿主机 DeepTutor 等本地客户端接入；仅本机回环，不对外网开放
    mem_limit: 1g                # 第三方代码资源上限
    tmpfs:
      - /tmp
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; socket.create_connection(('127.0.0.1', 8096), 2).close()"]
      interval: 15s
      timeout: 3s
      retries: 5
      start_period: 15s

  # ── 编程题沙箱 sidecar ──────────────────────────────────────────────────
  # 学生代码执行域：backend/worker 的 core/question/sandbox.py（service 模式）经
  # uds 调 /execute。隔离性质：network none（无出网、无内网可达）+ 非 root
  # （RLIMIT_NPROC 生效）+ 唯一挂载为 uds 共享卷 + 容器内零凭据零业务卷 + 容器级
  # 资源限额。攻击面回归：backend 侧 `pytest -m sandbox_service`。
  # 升级路径（更强的 per-exec 命名空间隔离）见 sandbox/app/main.py docstring 与
  # docs/DELIVERY.md。
  sandbox:
    build:
      context: ./sandbox
      args:
        UV_INDEX_URL: "${UV_INDEX_URL:-}"
    restart: unless-stopped
    network_mode: "none"   # 学生代码唯一接口 = uds（需 token）；无 eth/无默认路由
    mem_limit: 1g          # 4 并发 × RLIMIT_AS 256MB 头寸 + 服务自身开销
    cpus: 2
    pids_limit: 128        # fork 炸弹第二道闸（第一道 = 非 root 下 RLIMIT_NPROC）
    tmpfs:
      - /tmp               # 执行临时目录走内存盘，不给盘
    environment:
      SANDBOX_TOKEN: "${SANDBOX_TOKEN:-}"
      SANDBOX_CONCURRENCY: "4"
    volumes:
      - sandbox_sock:/run/sandbox   # 唯一挂载：uds socket；绝不挂代码/.env/uploads
    healthcheck:
      test: ["CMD", ".venv/bin/python", "-c", "import socket;s=socket.socket(socket.AF_UNIX);s.settimeout(2);s.connect('/run/sandbox/sandbox.sock')"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "0.0.0.0:80:80"
    depends_on:
      - backend

# 评测专用服务已拆到 docker-compose.eval.yml（非生产运行时，生产 up 不带它）：
#   docker compose -f docker-compose.yml -f docker-compose.eval.yml up -d eval

volumes:
  pgdata:
  backend_uploads:
  backend_venv:
  redisdata:
  sandbox_sock:
