services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-postgres}"
      POSTGRES_DB: course_agent
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # 持久化：AOF（每次写追加 appendonly.aof，默认 everysec fsync，最多丢 1s 数据）
    # + RDB 快照（60s 内 1000 次写则 dump.rdb），双保险；重启/重建容器数据不丢。
    command: ["redis-server", "--appendonly", "yes", "--save", "60", "1000"]
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "8002:8002"
    env_file:
      - ./backend/.env
    environment:
      # config 嵌套重构后代码读 DB__URL / DB__REDIS_URL（env_nested_delimiter="__"），
      # 不再认旧扁平名 DATABASE_URL / REDIS_URL。compose environment 优先级高于
      # env_file(./backend/.env)，这里用 Docker 服务名覆盖 .env 里的 localhost
      # （localhost 是宿主机开发用的，容器内回环连不到 postgres/redis 容器）。
      DB__URL: postgresql+asyncpg://postgres:${POSTGRES_PASSWORD:-postgres}@postgres:5432/course_agent
      DB__REDIS_URL: redis://redis:6379/0
      ENVIRONMENT: "${ENVIRONMENT:-development}"
      BACKEND_WORKERS: "${BACKEND_WORKERS:-4}"
      LLM_TIMEOUT_SEC: "${LLM_TIMEOUT_SEC:-120}"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend:/app
      - backend_venv:/app/.venv
      - backend_uploads:/app/uploads
    command: ["sh", "-c", "until .venv/bin/alembic upgrade head; do echo 'alembic failed, retrying in 5s...'; sleep 5; done && .venv/bin/gunicorn main:app -k uvicorn.workers.UvicornWorker -w ${BACKEND_WORKERS:-4} --bind 0.0.0.0:8002 --timeout 300 --graceful-timeout 30"]
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8002/api/health')\""]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s

  # ARQ 后台任务 worker：索引/研究/解题均在此进程中执行
  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      DB__URL: postgresql+asyncpg://postgres:${POSTGRES_PASSWORD:-postgres}@postgres:5432/course_agent
      DB__REDIS_URL: redis://redis:6379/0
      ENVIRONMENT: "${ENVIRONMENT:-development}"
      LLM_TIMEOUT_SEC: "${LLM_TIMEOUT_SEC:-120}"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      backend:
        condition: service_healthy
    volumes:
      - ./backend:/app
      - backend_venv:/app/.venv
      - backend_uploads:/app/uploads
    command: [".venv/bin/python", "-m", "arq", "worker.WorkerSettings"]

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "0.0.0.0:80:80"
    depends_on:
      - backend

volumes:
  pgdata:
  backend_uploads:
  backend_venv:
  redisdata:
